<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<style>
  [x-cloak]{display:none!important}
  .btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:.5rem;padding:.5rem .9rem;font-weight:600;font-size:.875rem;transition:background .15s}
  .btn-primary{background:#1d4ed8;color:#fff}.btn-primary:hover{background:#1e40af}
  .btn-primary:disabled{background:#93c5fd;cursor:not-allowed}
  .btn-ghost{background:#f1f5f9;color:#0f172a}.btn-ghost:hover{background:#e2e8f0}
  .btn-danger{background:#fee2e2;color:#991b1b}.btn-danger:hover{background:#fecaca}
  .btn-sm{padding:.25rem .55rem;font-size:.75rem;border-radius:.375rem}
  .inp{width:100%;border:1px solid #cbd5e1;border-radius:.5rem;padding:.45rem .65rem;font-size:.875rem;background:#fff}
  .inp:focus{outline:2px solid #93c5fd;border-color:#3b82f6}
  .lbl{display:block;font-size:.75rem;font-weight:600;color:#475569;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.03em}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:.9rem;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  .badge{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.15rem .6rem;font-size:.72rem;font-weight:700}
  .dot{width:.55rem;height:.55rem;border-radius:999px;display:inline-block}
  .tab-btn[aria-selected="true"]{background:#fff;color:#1d4ed8;box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
